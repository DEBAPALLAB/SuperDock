name: Feature request
description: Describe the everyday task you want to make easier.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Explain the task, how often it happens, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could the notch help?
